name: opc-tickets
x-app-base: &app-base
  image: opc-backend:local
  build:
    context: ..
    dockerfile: infraestructura/docker/backend/Dockerfile
  env_file:
    - .env
  environment:
    FLASK_DEBUG: "0"
    APP_DATA_DIR: /app/data
  restart: unless-stopped
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 256M

services:
  app1:
    <<: *app-base
    container_name: opc-app-1
    volumes:
      - app-data-1:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/api/health',
          timeout=5).getcode()==200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app2:
    <<: *app-base
    container_name: opc-app-2
    volumes:
      - app-data-2:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/api/health',
          timeout=5).getcode()==200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  lb:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: opc-lb
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro,z
    restart: unless-stopped
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64M

volumes:
  app-data-1:
    name: app-data-1
  app-data-2:
    name: app-data-2